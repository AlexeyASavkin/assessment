services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assessment
      SPRING_DATASOURCE_USERNAME: assessment
      SPRING_DATASOURCE_PASSWORD: assessment
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HMAC_SECRET: ${HMAC_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: