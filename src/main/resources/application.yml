spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/assessment
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    parameters:
      adminUsername: ${ADMIN_USERNAME}
      adminPasswordHash: ${ADMIN_PASSWORD_HASH}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
    gigachat:
      auth:
        bearer:
          api-key: ${GIGACHAT_API_KEY}
        scope: GIGACHAT_API_PERS
        unsafe-ssl: true
      chat:
        options:
          model: GigaChat-2
          temperature: 0.3

server:
  port: 8080

assessment:
  security:
    hmac-secret: ${HMAC_SECRET}
    session-cookie-name: SESSION_EMPLOYEE
    token-expiry-hours: 72
  rate-limiter:
    max-requests-per-minute: 15
  ai:
    active-provider: ${AI_PROVIDER:gemini}

resilience4j:
  ratelimiter:
    instances:
      geminiApi:
        limitForPeriod: 15
        limitRefreshPeriod: 1m
        timeoutDuration: 10s

logging:
  level:
    com.assessment: DEBUG
    org.springframework.ai: DEBUG
    io.github.resilience4j: DEBUG
