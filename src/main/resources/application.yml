spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/assessment
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
    gigachat:
      auth:
        bearer:
          api-key: ${GIGACHAT_API_KEY}
        scope: GIGACHAT_API_PERS
        unsafe-ssl: false
      chat:
        options:
          model: GigaChat-2
          temperature: 0.3

server:
  port: 8080
  forward-headers-strategy: framework

assessment:
  security:
    hmac-secret: ${HMAC_SECRET}
    session-cookie-name: SESSION_EMPLOYEE
    token-expiry-hours: 72
  question:
    max-questions-per-session: 20
  ai:
    active-provider: ${AI_PROVIDER:opencode}

resilience4j:
  ratelimiter:
    instances:
      geminiApi:
        limitForPeriod: 15
        limitRefreshPeriod: 1m
        timeoutDuration: 10s

logging:
  level:
    com.assessment: ${LOGGING_LEVEL_COM_ASSESSMENT:DEBUG}
    org.springframework.ai: ${LOGGING_LEVEL_SPRING_AI:DEBUG}
    io.github.resilience4j: ${LOGGING_LEVEL_RESILIENCE4J:DEBUG}
