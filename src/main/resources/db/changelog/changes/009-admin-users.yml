databaseChangeLog:
  - changeSet:
      id: '009-admin-users'
      author: assessment
      changes:
        - createTable:
            tableName: admin_users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  defaultValue: ADMIN
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - sql:
            sql: >
              INSERT INTO admin_users (id, username, password_hash, role, enabled, created_at, updated_at)
              VALUES (
                  gen_random_uuid(),
                  '${adminUsername}',
                  '${adminPasswordHash}',
                  'ADMIN',
                  true,
                  CURRENT_TIMESTAMP,
                  CURRENT_TIMESTAMP
              )
      rollback:
        - delete:
            tableName: admin_users
