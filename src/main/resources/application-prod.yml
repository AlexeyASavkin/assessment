# Prod-профиль: переопределения поверх application.yml.
# Активируется автоматически при SPRING_PROFILES_ACTIVE=prod (имя файла application-prod.yml)
# и явно помечен маркером профиля ниже.
#
# GigaChat: SSL-проверка включена (unsafe-ssl: false из базового application.yml).
# Для доверия к корневому CA (НУЦ Минцифры) подключён PEM-бандл через
# spring.ai.gigachat.auth.certs.ca-certs (задача T14) — путь задаётся переменной
# GIGACHAT_CA_CERTS (файл монтируется в контейнер). Остальной клиентский конфиг
# gigachat не дублируется — наследуется из application.yml.
spring:
  config:
    activate:
      on-profile: prod
  ai:
    gigachat:
      auth:
        certs:
          ca-certs: ${GIGACHAT_CA_CERTS:}

# Prod-логирование: INFO вместо DEBUG из базового application.yml.
logging:
  level:
    com.assessment: INFO
    org.springframework.ai: INFO
    io.github.resilience4j: INFO