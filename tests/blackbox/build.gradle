plugins {
    id 'java'
}

group = 'com.assessment.test'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def cucumberVersion = '7.21.0'
def okhttpVersion = '4.12.0'
def jacksonVersion = '2.18.2'

dependencies {
    // Cucumber
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    // Cucumber dependency injection (shared context between steps)
    testImplementation "io.cucumber:cucumber-picocontainer:${cucumberVersion}"

    // JUnit 5 (for assertions and runner)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.12.0'

    // HTTP client
    testImplementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"

    // JSON
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'

    // Assertions
    testImplementation 'org.assertj:assertj-core:3.27.3'

}

test {
    useJUnitPlatform()
    systemProperty 'cucumber.plugin', 'pretty,json:build/reports/cucumber.json'
}
