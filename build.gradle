plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.12.0'
}

group = 'com.assessment'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.gigachat.dev/releases' }
}

ext {
    set('springAiVersion', '2.0.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring AI - Google Gemini
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    // Spring AI - Sber GigaChat
    implementation 'chat.giga:spring-ai-starter-model-gigachat:2.0.0'
    // Spring AI - OpenRouter (OpenAI-compatible)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-model-chat-memory-repository-jdbc'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Liquibase
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    // Resilience4j
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.4.0'

    // JOOQ
    implementation 'org.jooq:jooq'
    implementation 'org.jooq:jooq-meta'
    implementation 'org.jooq:jooq-codegen'

    // Lombok
    compileOnly 'org.projectlombok:lombok'

    // Dotenv — загрузка .env в PropertySource при локальном запуске
    implementation 'me.paulschwarz:springboot4-dotenv:5.0.1'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // lombok-mapstruct-binding lets MapStruct see Lombok-generated getters/setters/builders
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // OpenAPI
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
    implementation 'jakarta.validation:jakarta.validation-api'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/openapi/admin/src/main/java"
            srcDir "${buildDir}/generated/openapi/employee/src/main/java"
        }
    }
}

def openapiConfig = { String spec, String outputDirName, String apiPkg ->
    return {
        generatorName = 'spring'
        inputSpec = "${rootDir}/api-specification/${spec}"
        outputDir = "${buildDir}/generated/openapi/${outputDirName}"
        modelPackage = 'com.assessment.dto'
        apiPackage = "com.assessment.controller.generated.${apiPkg}"
        modelNameSuffix = 'Dto'
        generateApiDocumentation = false
        generateModelDocumentation = false
        generateApiTests = false
        generateModelTests = false
        skipValidateSpec = true
        configOptions = [
            useSpringBoot3    : 'true',
            useJakartaEe      : 'true',
            dateLibrary       : 'java8',
            openApiNullable   : 'false',
            serializableModel : 'true',
            hideGenerationTimestamp: 'true',
            interfaceOnly     : 'true',
            skipDefaultInterface: 'true'
        ]
    }
}

tasks.register('generateAdminApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask,
        openapiConfig('admin-api.yml', 'admin', 'admin'))

tasks.register('generateEmployeeApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask,
        openapiConfig('employee-api.yml', 'employee', 'employee'))

tasks.named('compileJava') {
    dependsOn 'generateAdminApi', 'generateEmployeeApi'
}

tasks.named('test') {
    useJUnitPlatform()
}
