services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
