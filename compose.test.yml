services:
  postgres:
    image: postgres:18
    env_file: .env
    tmpfs: /var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment"]
      interval: 3s
      retries: 15

  backend:
    build: .
    env_file: .env
    environment:
      AI_PROVIDER: stub
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assessment
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 3s
      retries: 30
      start_period: 10s
